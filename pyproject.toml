[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-research-loop"
version = "0.1.0"
description = "Bounded research execution and conditional multi-model review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/reo91004/Crucible"
Documentation = "https://github.com/reo91004/Crucible/blob/main/README.md"
Issues = "https://github.com/reo91004/Crucible/issues"

[project.scripts]
crucible = "crucible.cli:main"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.setuptools.package-data]
crucible = ["templates/*.py", "integrations/opencode/*.js", "integrations/opencode/*.json"]
